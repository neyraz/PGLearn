<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>PGLearn</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky tab bar + single scrolling view column, max 1080px.
   Palette: cool slate neutrals, indigo-violet accent (synthesis), teal secondary.
   Group colours come from each location's own HSL hue. */
:root{
  --bg:#f5f6fb; --surface:#ffffff; --surface2:#eef0f7; --raise:#ffffff;
  --line:#dce0ec; --line2:#c7cde0;
  --fg:#191c2a; --fg2:#3a4057; --muted:#616a85; --faint:#8a92aa;
  --accent:#6d5ae6; --accent-ink:#5341cf; --accent-soft:#ece8ff;
  --teal:#0d8f86; --teal-soft:#d9f2ef;
  --ok:#1d8a52; --warn:#b4720a; --crit:#c8402f;
  --shadow:0 1px 2px rgba(20,24,45,.06),0 6px 22px rgba(20,24,45,.07);
  --shadow-sm:0 1px 2px rgba(20,24,45,.08);
  --r:14px; --r-sm:9px;
  --dsp:"Fraunces",Georgia,serif;
  --ui:"Hanken Grotesk",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d0f16; --surface:#161925; --surface2:#1e2230; --raise:#212636;
  --line:#2a2f41; --line2:#3a4156;
  --fg:#e9ebf4; --fg2:#c2c7da; --muted:#98a0b8; --faint:#6f7893;
  --accent:#9b88ff; --accent-ink:#b8aaff; --accent-soft:#241f3d;
  --teal:#3ad0c2; --teal-soft:#10322f;
  --ok:#49c483; --warn:#e0a53c; --crit:#f0715e;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.4);
  --shadow-sm:0 1px 2px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d0f16; --surface:#161925; --surface2:#1e2230; --raise:#212636;
  --line:#2a2f41; --line2:#3a4156;
  --fg:#e9ebf4; --fg2:#c2c7da; --muted:#98a0b8; --faint:#6f7893;
  --accent:#9b88ff; --accent-ink:#b8aaff; --accent-soft:#241f3d;
  --teal:#3ad0c2; --teal-soft:#10322f;
  --ok:#49c483; --warn:#e0a53c; --crit:#f0715e;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.4);
  --shadow-sm:0 1px 2px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);line-height:1.55;
  font-size:16px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
a{color:var(--accent-ink);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---- top bar ---- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1080px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;white-space:nowrap}
.brand .logo{width:26px;height:26px;flex:none}
.brand b{font-family:var(--dsp);font-weight:600;letter-spacing:-.01em}
.brand .v{font-size:11px;color:var(--faint);font-weight:500;letter-spacing:.04em}
.spacer{flex:1}
.themebtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;
  width:38px;height:38px;display:grid;place-items:center;flex:none}
.themebtn:hover{border-color:var(--line2)}

/* ---- tabs ---- */
.tabs{max-width:1080px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto;
  scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:11px 13px 13px;color:var(--muted);
  font-weight:600;font-size:14.5px;white-space:nowrap;border-bottom:2.5px solid transparent;
  display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--fg2)}
.tab[aria-selected="true"]{color:var(--accent-ink);border-bottom-color:var(--accent)}
.tab svg{width:17px;height:17px;flex:none}

/* ---- page wrap ---- */
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px;padding-block:28px 72px}
.view{display:none;animation:fade .3s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view.on{animation:none}*{scroll-behavior:auto!important}}

.eyebrow{font-size:12px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--accent-ink)}
.lead{color:var(--muted);font-size:17px;max-width:64ch}
.sec-h{font-family:var(--dsp);font-weight:600;font-size:clamp(22px,4vw,30px);letter-spacing:-.015em}

/* ---- cards ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.pad{padding:18px 20px}
.grid{display:grid;gap:14px}

/* chips & pills */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;
  padding:3px 10px;border-radius:999px;border:1px solid var(--line2);background:var(--surface2);color:var(--fg2)}
.chip.loc{border-color:hsl(var(--h) 45% 60%/.5);
  background:hsl(var(--h) 60% 55%/.12);color:hsl(var(--h) 55% 38%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.loc{color:hsl(var(--h) 70% 72%)}}
:root[data-theme="dark"] .chip.loc{color:hsl(var(--h) 70% 72%)}
.ess{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;letter-spacing:.02em}
.ess-yes{background:color-mix(in srgb,var(--crit) 16%,transparent);color:var(--crit)}
.ess-red{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.ess-no{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.ess-cond{background:var(--accent-soft);color:var(--accent-ink)}

.btn{border:1px solid var(--line2);background:var(--surface);border-radius:var(--r-sm);
  padding:9px 15px;font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;gap:8px;transition:.12s}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink);color:#fff}
.btn.sm{padding:6px 11px;font-size:13px}

input[type=text],input[type=search],select{font-family:inherit;font-size:15px;color:var(--fg);
  background:var(--surface);border:1px solid var(--line2);border-radius:var(--r-sm);padding:9px 12px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
label.fld{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}

.ref{font-size:13px;color:var(--muted)}
.ref a{font-weight:600}
mark{background:color-mix(in srgb,var(--accent) 28%,transparent);color:inherit;border-radius:3px;padding:0 1px}

/* ---- home ---- */
.hero{display:grid;gap:18px;padding:30px 24px 28px;border-radius:var(--r);position:relative;overflow:hidden;
  background:
   radial-gradient(120% 140% at 88% -10%,color-mix(in srgb,var(--accent) 20%,transparent),transparent 60%),
   radial-gradient(90% 120% at 0% 110%,color-mix(in srgb,var(--teal) 16%,transparent),transparent 55%),
   var(--surface);
  border:1px solid var(--line)}
.hero h1{font-family:var(--dsp);font-weight:600;font-size:clamp(28px,6vw,46px);letter-spacing:-.025em;max-width:16ch}
.hero .lead{font-size:clamp(16px,2.4vw,19px)}
.home-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:4px}
.tile{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px 17px;display:flex;flex-direction:column;gap:7px;transition:.14s;box-shadow:var(--shadow-sm)}
.tile:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:var(--shadow)}
.tile .ti{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink)}
.tile h3{font-size:16.5px;font-weight:700}
.tile p{font-size:13.5px;color:var(--muted);line-height:1.45}
.stat-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:2px}
.stat{background:var(--surface2);border-radius:10px;padding:9px 14px;font-size:13px;color:var(--muted);font-weight:600}
.stat b{color:var(--fg);font-size:19px;font-family:var(--mono);margin-right:5px}

/* ---- pathway stepper ---- */
.pw-layout{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:start}
@media(max-width:760px){.pw-layout{grid-template-columns:1fr}}
.pw-list{display:flex;flex-direction:column;gap:3px;position:sticky;top:120px}
@media(max-width:760px){.pw-list{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}}
.pw-step{border:1px solid transparent;background:transparent;border-radius:10px;padding:9px 11px;text-align:left;
  display:flex;gap:11px;align-items:flex-start;white-space:normal}
@media(max-width:760px){.pw-step{min-width:150px}}
.pw-step:hover{background:var(--surface2)}
.pw-step[aria-current="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.pw-num{font-family:var(--mono);font-size:12px;font-weight:600;width:24px;height:24px;flex:none;border-radius:7px;
  display:grid;place-items:center;background:var(--surface2);color:var(--muted)}
.pw-step[aria-current="true"] .pw-num{background:var(--accent);color:#fff}
.pw-step .pt{font-size:13.5px;font-weight:600;line-height:1.3}
.pw-step .pl{font-size:11.5px;color:var(--faint)}
.pw-stage{min-width:0}
.membrane{position:relative;height:150px;border-radius:12px;margin:8px 0 18px;overflow:hidden;
  background:linear-gradient(var(--surface2),var(--surface2));border:1px solid var(--line)}
.mem-band{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:46px;
  background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--warn) 32%,transparent) 0 7px,transparent 7px 15px);
  border-top:2px solid color-mix(in srgb,var(--warn) 55%,transparent);border-bottom:2px solid color-mix(in srgb,var(--warn) 55%,transparent);opacity:.5}
.mem-lbl{position:absolute;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.mem-lbl.top{top:6px;left:10px}.mem-lbl.bot{bottom:6px;left:10px}
.mol{position:absolute;left:50%;transition:all .7s cubic-bezier(.5,0,.2,1);transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:4px}
.mol .dot{width:17px;height:17px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.mol .carrier{width:3px;height:30px;background:var(--teal);border-radius:2px}
.mol .tag{font-size:11px;font-weight:700;font-family:var(--mono);background:var(--surface);border:1px solid var(--line2);padding:1px 7px;border-radius:999px;white-space:nowrap}
.pw-body h3{font-family:var(--dsp);font-weight:600;font-size:21px;margin-bottom:3px}
.pw-enz{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}
.pw-enz button{border:1px solid var(--line2);background:var(--surface2);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.pw-enz button:hover{border-color:var(--accent);color:var(--accent-ink)}
.pw-nav{display:flex;gap:10px;margin-top:18px}

/* ---- atlas ---- */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 18px}
.fbtn{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;gap:7px;align-items:center}
.fbtn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.fbtn .sw{width:9px;height:9px;border-radius:50%;background:hsl(var(--h) 60% 55%)}
.atlas{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ecard{display:flex;flex-direction:column;gap:9px;cursor:pointer;transition:.14s;border-left:4px solid hsl(var(--h) 60% 55%)}
.ecard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.ecard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ecard h3{font-size:17px;font-weight:700}
.ecard .rxn{font-family:var(--mono);font-size:12px;color:var(--teal);background:var(--teal-soft);padding:5px 8px;border-radius:7px;line-height:1.4;word-break:break-word}
.ecard .plain{font-size:14px;color:var(--fg2);line-height:1.5}
.ecard .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* ---- modal ---- */
.ov{position:fixed;inset:0;z-index:60;background:rgba(10,12,22,.55);backdrop-filter:blur(3px);
  display:none;align-items:flex-end;justify-content:center;padding:0}
.ov.on{display:flex}
@media(min-width:620px){.ov{align-items:center;padding:24px}}
.modal{background:var(--surface);border:1px solid var(--line);width:100%;max-width:640px;max-height:92vh;overflow:auto;
  border-radius:18px 18px 0 0;box-shadow:var(--shadow);animation:slideup .28s ease}
@media(min-width:620px){.modal{border-radius:18px}}
@keyframes slideup{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.modal-h{position:sticky;top:0;background:var(--surface);padding:18px 22px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.modal-h h2{font-family:var(--dsp);font-weight:600;font-size:23px}
.xbtn{border:1px solid var(--line);background:var(--surface2);border-radius:999px;width:34px;height:34px;flex:none;display:grid;place-items:center;font-size:18px}
.modal-b{padding:16px 22px 26px;display:flex;flex-direction:column;gap:14px}
.modal-b .blk h4{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:5px}
.modal-b .fact{background:var(--accent-soft);border-radius:11px;padding:13px 15px;font-size:14.5px;color:var(--fg);line-height:1.5}
.modal-b .fact::before{content:"◆ Why it's interesting";display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:4px}

/* ---- calculator ---- */
.calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:720px){.calc-grid{grid-template-columns:1fr}}
.subrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface2);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.subrow select{width:auto;flex:1;min-width:120px}
.readout{background:var(--fg);color:var(--bg);border-radius:14px;padding:20px 22px;position:sticky;top:120px}
:root[data-theme="dark"] .readout,:root:not([data-theme="light"]) .readout{background:var(--raise);color:var(--fg);border:1px solid var(--line2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .readout{background:var(--raise);color:var(--fg);border:1px solid var(--line2)}}
.readout .big{font-family:var(--mono);font-size:34px;font-weight:500;letter-spacing:-.02em;line-height:1.1}
.readout .unit{font-size:14px;opacity:.7;font-weight:600}
.readout .mzrow{display:flex;gap:20px;margin-top:14px;flex-wrap:wrap}
.readout .mzrow div span{display:block;font-size:12px;opacity:.65;font-weight:600}
.readout .mzrow div b{font-family:var(--mono);font-size:18px;font-weight:500}
.formula{font-family:var(--mono);font-size:13px;opacity:.75;margin-top:12px}
.reftbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.reftbl th,.reftbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.reftbl th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.reftbl td.m{font-family:var(--mono);text-align:right}
.reftbl tr{cursor:pointer}
.reftbl tbody tr:hover{background:var(--surface2)}
.tablewrap{overflow-x:auto}

/* ---- compare ---- */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:620px){.cmp{grid-template-columns:1fr}}
.cmp .col h3{font-family:var(--dsp);font-weight:600;font-size:20px;margin-bottom:4px}
.cmp ul{margin:10px 0 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.cmp li{display:flex;gap:9px;font-size:14px;line-height:1.45}
.cmp li .k{font-weight:700;min-width:96px;color:var(--muted);font-size:12.5px}

/* ---- quiz ---- */
.quiz-card{max-width:620px;margin:0 auto}
.qbar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-bottom:20px}
.qbar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.qopt{display:block;width:100%;text-align:left;border:1.5px solid var(--line2);background:var(--surface);
  border-radius:11px;padding:13px 15px;font-size:15px;font-weight:500;margin-bottom:9px;transition:.12s}
.qopt:hover:not(:disabled){border-color:var(--accent)}
.qopt.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.qopt.wrong{border-color:var(--crit);background:color-mix(in srgb,var(--crit) 12%,transparent)}
.qwhy{background:var(--surface2);border-radius:11px;padding:14px 16px;font-size:14px;color:var(--fg2);line-height:1.5;margin-top:4px}
.qwhy b{color:var(--accent-ink)}

/* ---- refs / glossary ---- */
.reflist{display:flex;flex-direction:column;gap:2px}
.refitem{padding:12px 4px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.5}
.refitem .t{font-weight:600;color:var(--fg)}
.refitem .j{color:var(--muted);font-size:13px}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.gterm{border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:var(--surface)}
.gterm dt{font-weight:700;font-size:15px;margin-bottom:3px}
.gterm dd{margin:0;font-size:13.5px;color:var(--muted);line-height:1.45}
.note{font-size:13px;color:var(--faint);margin-top:10px}

/* ---- deep-detail additions ---- */
.chip.mono{font-family:var(--mono);font-size:11.5px}
.kvgrid{display:grid;grid-template-columns:1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kv{display:flex;justify-content:space-between;gap:12px;background:var(--surface);padding:9px 13px;font-size:13.5px}
.kv span{color:var(--muted)}
.kv b{font-weight:600;text-align:right}
.pw-enz-b{border:1px solid var(--line2);background:var(--surface2);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.pw-enz-b:hover{border-color:var(--accent);color:var(--accent-ink)}
/* chemistry block in pathway */
.chem{margin:14px 0 4px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.chem-eq{background:var(--teal-soft);color:var(--teal);padding:11px 14px;font-size:12.5px;line-height:1.5;border-bottom:1px solid var(--line);word-break:break-word}
.chem-rows{display:flex;flex-direction:column}
.chem-row{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13.5px}
.chem-row:last-child{border-bottom:0}
.chem-row span{font-weight:700;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.chem-row p{color:var(--fg2);line-height:1.5}
@media(max-width:520px){.chem-row{grid-template-columns:1fr;gap:3px}}
/* drug extra */
.dx{border:1px solid var(--line);border-radius:11px;overflow:hidden;margin:2px 0}
.dx-row{display:grid;grid-template-columns:104px 1fr;gap:12px;padding:9px 13px;border-bottom:1px solid var(--line);font-size:13.5px}
.dx-row:last-child{border-bottom:0}
.dx-row span{font-weight:700;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
.dx-row p{color:var(--fg2);line-height:1.5}
@media(max-width:520px){.dx-row{grid-template-columns:1fr;gap:3px}}
/* anatomy */
.anat-card{display:flex;flex-direction:column;gap:14px}
.anat-tip{background:var(--surface2);border-radius:10px;padding:13px 16px;font-size:14px;color:var(--fg2);line-height:1.5;min-height:3.2em;transition:.15s}
.anat-tip.show{background:var(--accent-soft);color:var(--fg)}
.anat-hit{cursor:pointer;transition:.12s}
.anat-hit:hover,.anat-hit.sel{opacity:1}
.anat-hit:hover rect,.anat-hit.sel rect{stroke:var(--accent);stroke-width:2.5}
.anat-hit:focus-visible{outline:none}
.anat-hit:focus-visible rect{stroke:var(--accent);stroke-width:3}
.resnum{font-family:var(--mono);font-size:13px;font-weight:600;width:26px;height:26px;flex:none;border-radius:7px;display:grid;place-items:center;background:var(--accent);color:#fff}
/* numbers grid */
.num-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.numcard{border:1px solid var(--line);border-radius:14px;padding:16px 17px;background:var(--surface);box-shadow:var(--shadow-sm)}
.numv{font-size:26px;font-weight:500;letter-spacing:-.01em;color:var(--accent-ink);line-height:1.1}
.numv span{font-size:13px;color:var(--muted);font-weight:600}
.numk{font-weight:700;font-size:14.5px;margin:6px 0 4px}
.numd{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:8px}

const ATOM = {C:12.0, H:1.0078250319, N:14.0030740052, O:15.9949146221};
function fmass(f){ // elemental formula string -> monoisotopic mass
  let t=0, re=/([A-Z][a-z]?)(\d*)/g, mch;
  while((mch=re.exec(f))){ if(mch[1]) t+=ATOM[mch[1]]*(mch[2]?parseInt(mch[2]):1); }
  return t;
}
const W = fmass("H2O");

const COMP = {GlcNAc:"C8H15NO6", MurNAc:"C11H19NO8", Ala:"C3H7NO2",
  Glu:"C5H9NO4", DAP:"C7H14N2O4", Lys:"C6H14N2O2"};
const CM = {}; for(const k in COMP) CM[k]=fmass(COMP[k]);
const DELTA = {OAc:fmass("C2H2O"), amid:(ATOM.N+ATOM.H-ATOM.O), reduce:2*ATOM.H, anhydro:-W, deAc:-fmass("C2H2O")};

function stemSeq(n, pos3){ return ["Ala","Glu",pos3,"Ala","Ala"].slice(0,n); }

/* one subunit (non-reduced, free reducing end), disaccharide + stem */
function subunitMass(n, pos3){
  const parts = ["GlcNAc","MurNAc", ...stemSeq(n,pos3)];
  let mass = parts.reduce((s,p)=>s+CM[p],0);
  const bonds = 1 /*glycosidic*/ + (n>=1?1:0) /*MurNAc-Ala*/ + Math.max(0,n-1) /*peptide*/;
  return mass - bonds*W;
}

   cfg: {subunits:[{n,pos3}], end:'reduce'|'anhydro'|'free', oac:int, amid:int}

function muropeptide(cfg){

  let mass = subs.reduce((s,u)=>s+subunitMass(u.n,u.pos3),0);
  mass -= (subs.length-1)*W;              // cross-link amide bonds
  if(cfg.end==="reduce") mass += DELTA.reduce;   // one reducing end reduced to muramitol
  else if(cfg.end==="anhydro") mass += DELTA.anhydro;
  mass += (cfg.oac||0)*DELTA.OAc;
  mass += (cfg.amid||0)*DELTA.amid;

function go(id){
  CURRENT=id;
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.tab===id));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+id));
  if(RENDER[id]&&!RENDER[id].done){RENDER[id]();RENDER[id].done=true;}

  if(act)act.scrollIntoView({inline:'center',block:'nearest'});
  window.scrollTo({top:0,behavior:'instant'in document.documentElement.style?'instant':'auto'});
  if(location.hash.slice(1)!==id){history.replaceState(null,'','#'+id);}
}

    </g>
    <!-- cross-link: D-Ala(4) top stem -> m-DAP(3) bottom stem -->
    <g class="anat-hit" data-k="xlink">
      <path d="M256 197 C295 197 300 186 330 186" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="2 0"/>

const ANAT_TXT={
  GlcNAc:"GlcNAc — N-acetylglucosamine. One of the two backbone sugars; alternates with MurNAc along the glycan strand.",
  MurNAc:"MurNAc — N-acetylmuramic acid. Carries the stem peptide on its D-lactyl group; nearly unique to the bacterial wall.",
  stem:"Stem peptide — a short chain (up to 5 residues) on each MurNAc. Neighbouring stems are cross-linked to make the net.",

function wireAnatomy(){

  list.addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b)setStep(+b.dataset.i);});

function setStep(i){
  pwStep=i;const p=PATH[i];
  document.querySelectorAll('.pw-step').forEach((s,j)=>s.setAttribute('aria-current',j===i));
  const posY={'cyto':'78%','mem-in':'62%','flip':'50%','mem-out':'30%'}[p.side];
  const posX={'cyto':'22%','mem-in':'40%','flip':'50%','mem-out':'72%'}[p.side];
  const enzChips=p.enz.map(id=>{const e=byId(id);return e?`<button data-enz="${id}">${esc(e.n)}</button>`:'';}).join('');
  $('#pw-stage').innerHTML=`
    <div class="membrane">
      <span class="mem-lbl top">Periplasm / outside</span>
      <span class="mem-lbl bot">Cytoplasm / inside</span>
      <div class="mem-band"></div>
      <div class="mol" style="top:${posY};left:${posX}">
        <span class="tag">${esc(p.mol)}</span>
        ${p.side==='mem-in'||p.side==='flip'||p.side==='mem-out'?'<span class="carrier"></span>':''}
        <span class="dot"></span>
      </div>
    </div>
    <h3>${esc(p.title)}</h3>
    <span class="chip loc" style="--h:${hueOf(sideGrp(p.side))}">${esc(p.loc)}</span>
    <p style="margin-top:12px;color:var(--fg2);font-size:15.5px;line-height:1.6">${esc(p.what)}</p>
    ${pathChem(p.k)}
    <div class="pw-enz" style="margin-bottom:4px">${enzChips}</div>
    <div class="pw-nav">
      <button class="btn sm" ${i===0?'disabled':''} id="pw-prev">← Previous</button>
      <button class="btn sm primary" ${i===PATH.length-1?'disabled':''} id="pw-next">Next step →</button>
    </div>`;
  const prev=$('#pw-prev'),next=$('#pw-next');
  if(prev)prev.onclick=()=>setStep(i-1);
  if(next)next.onclick=()=>setStep(i+1);
  $('#pw-stage').querySelectorAll('[data-enz]').forEach(b=>b.addEventListener('click',()=>openEnz(b.dataset.enz)));
}
function sideGrp(side){return {'cyto':'cyto','mem-in':'mem','flip':'mem','mem-out':'poly'}[side]||'poly';}
function pathChem(k){
  const x=(typeof PX!=='undefined'&&PX[k]);if(!x)return '';
  return `<div class="chem">
    ${x.chem?`<div class="chem-eq mono">${esc(x.chem)}</div>`:''}
    <div class="chem-rows">
      ${x.bonds?`<div class="chem-row"><span>Bonds</span><p>${esc(x.bonds)}</p></div>`:''}
      ${x.energy?`<div class="chem-row"><span>Energy / notes</span><p>${esc(x.energy)}</p></div>`:''}
      ${x.note?`<div class="chem-row"><span>Why it matters</span><p>${esc(x.note)}</p></div>`:''}
    </div></div>`;
}

function drawAtlas(){

  g.innerHTML=list.map(e=>`
    <div class="card pad ecard" data-enz="${e.id}" style="--h:${hueOf(e.grp)}" tabindex="0" role="button">

}

function openEnz(id){
  const e=byId(id);if(!e)return;
  const essLbl={yes:'Essential — the cell dies without it',red:'Redundantly essential — backed up by paralogues',no:'Dispensable in the lab',cond:'Conditionally important'};
  const d=(typeof DX!=='undefined'&&DX[id])||{};
  const metaChips=[];
  if(d.ec&&d.ec!=='—')metaChips.push(`<span class="chip mono">EC ${esc(d.ec)}</span>`);
  if(d.fam)metaChips.push(`<span class="chip">${esc(d.fam)}</span>`);
  const nums=(d.nums||[]).map(n=>`<div class="kv"><span>${esc(n[0])}</span><b>${esc(n[1])}</b></div>`).join('');
  const partnerBtns=(d.partners||[]).map(pid=>{const pe=byId(pid);return pe?`<button class="pw-enz-b" data-enz="${pid}">${esc(pe.n)}</button>`:'';}).join('');
  const blk=(h,body)=>body?`<div class="blk"><h4>${h}</h4>${body}</div>`:'';
  $('#modal').innerHTML=`
    <div class="modal-h">
      <div><h2 id="ov-title">${esc(e.n)}</h2>
        <div class="meta" style="margin-top:7px;display:flex;gap:6px;flex-wrap:wrap">
          <span class="chip loc" style="--h:${hueOf(e.grp)}">${GROUPS[e.grp].label}</span>
          <span class="ess ess-${e.ess}">${essLbl[e.ess]}</span>${metaChips.join('')}</div></div>
      <button class="xbtn" id="ov-close" aria-label="Close">×</button>
    </div>
    <div class="modal-b">
      <div class="blk"><h4>Reaction</h4><div class="rxn" style="font-family:var(--mono);font-size:13px;color:var(--teal);background:var(--teal-soft);padding:9px 12px;border-radius:8px">${esc(e.rxn)}</div></div>
      ${blk('In plain terms',`<p style="font-size:15.5px;line-height:1.6">${esc(e.plain)}</p>`)}
      ${blk('What it actually does',`<p style="color:var(--fg2);line-height:1.6">${esc(e.detail)}</p>`)}
      ${blk('Structure',d.struct?`<p style="color:var(--fg2);line-height:1.6">${esc(d.struct)}</p>`:'')}
      ${blk('Mechanism',d.mech?`<p style="color:var(--fg2);line-height:1.6">${esc(d.mech)}</p>`:'')}
      ${blk('Regulation & genetics',d.reg?`<p style="color:var(--fg2);line-height:1.6">${esc(d.reg)}</p>`:'')}
      ${nums?`<div class="blk"><h4>Key numbers</h4><div class="kvgrid">${nums}</div></div>`:''}
      <div class="fact">${esc(e.fact)}</div>
      ${partnerBtns?`<div class="blk"><h4>Works with</h4><div class="pw-enz" style="margin:0">${partnerBtns}</div></div>`:''}
      ${blk('Mainly studied in',`<p style="font-style:italic;color:var(--muted)">${esc(e.org)}</p>`)}
      ${blk('Key papers',`<p class="ref">${refListInline(e.refs)}</p>`)}
    </div>`;
  const ov=$('#ov');ov.classList.add('on');document.body.style.overflow='hidden';
  $('#modal').querySelectorAll('[data-enz]').forEach(b=>b.addEventListener('click',()=>openEnz(b.dataset.enz)));
  $('#ov-close').focus();
  $('#ov-close').onclick=closeOv;
  $('#modal').scrollTop=0;
}
function closeOv(){$('#ov').classList.remove('on');document.body.style.overflow='';}
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeOv();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOv();});

function drugExtra(name){
  const x=(typeof DRUGX!=='undefined'&&DRUGX[name]);if(!x)return '';
  const row=(k,v)=>v&&v!=='—'?`<div class="dx-row"><span>${k}</span><p>${esc(v)}</p></div>`:'';
  const rows=row('Spectrum',x.spectrum)+row('Resistance',x.resist)+row('Clinical use',x.clinical);
  return rows?`<div class="dx">${rows}</div>`:'';
}

/* ---------- CALCULATOR ---------- */
const calcState={subunits:[{n:4,pos3:"DAP"}],end:"reduce",oac:0,amid:0};
RENDER.calc=function(){
  $('#v-calc').innerHTML=`
   <span class="eyebrow">Muropeptide mass calculator</span>
   <h2 class="sec-h" style="margin:6px 0 10px">Build a muropeptide, get its mass</h2>
   <p class="lead" style="margin-bottom:18px">Monoisotopic masses for the neutral molecule and common charge states. The backbone is GlcNAc-MurNAc; stem is L-Ala·D-Glu·(m-DAP or L-Lys)·D-Ala·D-Ala. Arithmetic checked against published values (M4 reduced = 941.41, TetraTetra = 1862.79).</p>
   <div class="calc-grid">
     <div class="card pad">
       <h3 style="font-size:15px;margin-bottom:12px">Composition</h3>
       <div id="calc-subs"></div>
       <div style="display:flex;gap:8px;margin:6px 0 16px">
         <button class="btn sm" id="calc-add">+ Add subunit (oligomer)</button>
         <button class="btn sm" id="calc-rm">− Remove</button>
       </div>
       <label class="fld">Reducing end (MurNAc)</label>
       <select id="calc-end" style="margin-bottom:14px">
         <option value="reduce">Reduced — muramitol (+2H, as in UPLC)</option>
         <option value="free">Free reducing sugar</option>
         <option value="anhydro">1,6-anhydro (chain terminus, −H₂O)</option>
       </select>
       <div class="calc-grid" style="gap:12px">
         <div><label class="fld">O-acetyl groups (+42.01 each)</label><input type="text" inputmode="numeric" id="calc-oac" value="0"></div>
         <div><label class="fld">Amidations (−0.98 each)</label><input type="text" inputmode="numeric" id="calc-amid" value="0"></div>
       </div>
     </div>
     <div class="readout" id="calc-out"></div>
   </div>
   <div class="card pad" style="margin-top:18px">
     <h3 style="font-size:15px;margin-bottom:4px">Reference muropeptides</h3>
     <p class="note" style="margin:0 0 6px">Click a row to load it into the builder. All masses reduced unless noted.</p>
     <div class="tablewrap"><table class="reftbl"><thead><tr><th>ID</th><th>Species</th><th class="m">[M] mono</th><th class="m">[M+H]⁺</th></tr></thead>
     <tbody id="calc-reftbl"></tbody></table></div>
   </div>`;
  $('#calc-add').onclick=()=>{if(calcState.subunits.length<3){calcState.subunits.push({n:4,pos3:"DAP"});drawCalcSubs();recalc();}};
  $('#calc-rm').onclick=()=>{if(calcState.subunits.length>1){calcState.subunits.pop();drawCalcSubs();recalc();}};
  $('#calc-end').onchange=e=>{calcState.end=e.target.value;recalc();};
  $('#calc-oac').oninput=e=>{calcState.oac=clampInt(e.target.value);recalc();};
  $('#calc-amid').oninput=e=>{calcState.amid=clampInt(e.target.value);recalc();};
  $('#calc-reftbl').innerHTML=MP_REF.map(r=>{const m=muropeptide(r.cfg);
    return `<tr data-ref="${r.id}"><td><b>${r.id}</b></td><td>${esc(r.name)}</td><td class="m">${m.toFixed(3)}</td><td class="m">${mz(m,1).toFixed(3)}</td></tr>`;}).join('');
  $('#calc-reftbl').addEventListener('click',e=>{const tr=e.target.closest('[data-ref]');if(!tr)return;
    const r=MP_REF.find(x=>x.id===tr.dataset.ref);
    calcState.subunits=r.cfg.subunits.map(s=>({...s}));calcState.end=r.cfg.end;calcState.oac=0;calcState.amid=0;
    $('#calc-end').value=calcState.end;$('#calc-oac').value=0;$('#calc-amid').value=0;
    drawCalcSubs();recalc();window.scrollTo({top:0,behavior:'smooth'});});
  drawCalcSubs();recalc();
};
function clampInt(v){v=parseInt(v)||0;return Math.max(0,Math.min(12,v));}
function drawCalcSubs(){
  $('#calc-subs').innerHTML=calcState.subunits.map((s,i)=>`
    <div class="subrow">
      <span class="chip" style="background:var(--accent-soft);color:var(--accent-ink)">${calcState.subunits.length>1?'Subunit '+(i+1):'Monomer'}</span>
      <select data-si="${i}" data-k="n">
        ${[1,2,3,4,5].map(n=>`<option value="${n}" ${s.n===n?'selected':''}>${n}-residue stem</option>`).join('')}
      </select>
      <select data-si="${i}" data-k="pos3">
        <option value="DAP" ${s.pos3==='DAP'?'selected':''}>m-DAP (pos 3)</option>
        <option value="Lys" ${s.pos3==='Lys'?'selected':''}>L-Lys (pos 3)</option>
      </select>
    </div>`).join('');
  $('#calc-subs').querySelectorAll('select').forEach(sel=>sel.onchange=e=>{
    const i=+e.target.dataset.si,k=e.target.dataset.k;
    calcState.subunits[i][k]=k==='n'?+e.target.value:e.target.value;recalc();});
}
function recalc(){
  const m=muropeptide(calcState);
  const xlink=calcState.subunits.length-1;
  const desc=calcState.subunits.map(s=>s.n+'·'+s.pos3).join('  +  ');
  $('#calc-out').innerHTML=`
    <div class="unit">Monoisotopic neutral mass [M]</div>
    <div class="big">${m.toFixed(4)}<span style="font-size:16px;opacity:.6"> Da</span></div>
    <div class="mzrow">
      <div><span>[M+H]⁺</span><b>${mz(m,1).toFixed(4)}</b></div>
      <div><span>[M+2H]²⁺</span><b>${mz(m,2).toFixed(4)}</b></div>
      <div><span>[M−H]⁻</span><b>${(m-1.007276).toFixed(4)}</b></div>
    </div>
    <div class="formula">${calcState.subunits.length===1?'Monomer':calcState.subunits.length===2?'Dimer':'Trimer'}
      · ${esc(desc)} · ${xlink?xlink+' cross-link'+(xlink>1?'s':''):'no cross-link'}
      · ${calcState.end==='reduce'?'reduced':calcState.end==='anhydro'?'anhydro':'free'}
      ${calcState.oac?' · '+calcState.oac+'× O-acetyl':''}${calcState.amid?' · '+calcState.amid+'× amide':''}</div>`;
}

   <div class="cmp">
     <div class="col card pad"><h3>Gram-negative</h3><p class="note" style="margin:0">E. coli · thin wall between two membranes</p>

     <div class="col card pad"><h3>Gram-positive</h3><p class="note" style="margin:0">S. aureus · thick wall, one membrane</p>
       <ul>${rows.map(r=>`<li><span class="k">${esc(r[0])}</span><span>${esc(r[2])}</span></li>`).join('')}</ul></div>
   </div>
   <div class="card pad" style="margin-top:16px;border-left:4px solid var(--teal)">
     <h4 style="font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--teal);margin-bottom:6px">Where Myxococcus xanthus fits</h4>
     <p style="font-size:14.5px;color:var(--fg2);line-height:1.6">M. xanthus is a Gram-negative δ-proteobacterium, so it carries the thin-wall, meso-DAP, two-membrane plan — but it is unusual: during its gliding motility and multicellular development the wall is extensively remodelled, and recent work shows its peptidoglycan is more dynamic and locally variable than the textbook rod. It's a good system precisely because wall remodelling is front and centre.</p>
     <p class="ref" style="margin-top:8px">${refListInline(['egan2020','anderson2025'])}</p>
   </div>`;
};

/* ---------- QUIZ ---------- */
let qi=0,qScore=0,qAnswered=false;
RENDER.quiz=function(){qi=0;qScore=0;drawQ();};
function drawQ(){
  if(qi>=QUIZ.length){
    const pct=Math.round(qScore/QUIZ.length*100);
    $('#v-quiz').innerHTML=`<div class="quiz-card card pad" style="text-align:center">
      <span class="eyebrow">Done</span>
      <h2 class="sec-h" style="margin:10px 0">${qScore} / ${QUIZ.length} correct</h2>
      <p class="lead" style="margin:0 auto 18px">${pct>=80?'Excellent — you know your wall.':pct>=50?'Solid. Review the atlas for the ones that slipped.':'Worth another pass through the pathway and atlas.'}</p>
      <button class="btn primary" id="q-again">Retake</button></div>`;
    $('#q-again').onclick=()=>{qi=0;qScore=0;drawQ();};return;
  }
  qAnswered=false;const q=QUIZ[qi];
  $('#v-quiz').innerHTML=`<div class="quiz-card">
    <div class="qbar"><i style="width:${qi/QUIZ.length*100}%"></i></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <span class="eyebrow">Question ${qi+1} of ${QUIZ.length}</span>
      <span class="chip">Score ${qScore}</span></div>
    <div class="card pad">
      <h3 style="font-size:18px;font-weight:700;line-height:1.4;margin-bottom:16px">${esc(q.q)}</h3>
      <div id="q-opts">${q.o.map((o,i)=>`<button class="qopt" data-i="${i}">${esc(o)}</button>`).join('')}</div>
      <div id="q-after"></div>
    </div></div>`;
  $('#q-opts').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b&&!qAnswered)answerQ(+b.dataset.i);});
}
function answerQ(pick){
  qAnswered=true;const q=QUIZ[qi];
  if(pick===q.a)qScore++;
  document.querySelectorAll('.qopt').forEach((b,i)=>{b.disabled=true;
    if(i===q.a)b.classList.add('correct');
    else if(i===pick)b.classList.add('wrong');});
  $('#q-after').innerHTML=`<div class="qwhy"><b>${pick===q.a?'Correct.':'Not quite.'}</b> ${esc(q.why)}</div>
    <button class="btn primary" id="q-next" style="margin-top:14px">${qi===QUIZ.length-1?'See results':'Next question'} →</button>`;
  $('#q-next').onclick=()=>{qi++;drawQ();};
}

/* ---------- GLOSSARY + REFS ---------- */
const GLOSS=[
 ['Peptidoglycan / murein','The mesh-like polymer that forms the bacterial cell wall: glycan chains of alternating GlcNAc and MurNAc, cross-linked through short stem peptides into one giant sac (the sacculus).'],
 ['Sacculus','The single, bag-shaped peptidoglycan molecule that encloses the cell and gives it shape and osmotic strength.'],
 ['GlcNAc / MurNAc','N-acetylglucosamine and N-acetylmuramic acid — the two sugars of the backbone. MurNAc carries the stem peptide and is nearly unique to bacteria.'],
 ['Lipid II','The complete membrane-anchored monomer (GlcNAc-MurNAc-pentapeptide on the C55 carrier). The key hand-off molecule and a prime drug target.'],
 ['Undecaprenyl phosphate (C55-P)','The recyclable lipid carrier (bactoprenol) that ferries precursors across the membrane. The pool is tiny, so its recycling is rate-limiting.'],
 ['Stem peptide','The short peptide on MurNAc (up to 5 residues: L-Ala·D-Glu·DAP or Lys·D-Ala·D-Ala) that gets cross-linked to neighbours.'],
 ['m-DAP','meso-diaminopimelic acid — the position-3 residue in most Gram-negatives and bacilli; replaced by L-Lys in many Gram-positives.'],
 ['Transpeptidation','Forming the peptide cross-link between stems. D,D makes a 4→3 link (β-lactam-sensitive PBPs); L,D makes a 3→3 link (cysteine enzymes).'],
 ['PBP','Penicillin-binding protein. Class A: glycan polymerase + transpeptidase. Class B: transpeptidase only, partnered with a SEDS protein.'],
 ['SEDS protein','Shape, Elongation, Division, Sporulation family (RodA, FtsW) — a second, membrane-embedded glycan polymerase family.'],
 ['Elongasome / Divisome','The two multi-protein machines: one (MreB, RodA-PBP2) builds the side wall; the other (FtsZ, FtsW-PBP3) builds the septum.'],
 ['Muropeptide','A fragment released when the sacculus is digested (e.g. by a muramidase) for HPLC/MS analysis — the unit that composition studies quantify.'],
 ['Monoisotopic mass','The mass computed using the most abundant isotope of each element — what high-resolution mass spectrometry measures, versus average mass.'],
 ['1,6-anhydro-MurNAc','The ring-closed MurNAc made by lytic transglycosylases; marks glycan chain ends and feeds recycling.'],
];
RENDER.refs=function(){
  const refs=Object.values(REFS).sort((a,b)=>a.y-b.y);
  $('#v-refs').innerHTML=`
   <span class="eyebrow">Glossary</span>
   <h2 class="sec-h" style="margin:6px 0 12px">Key terms</h2>
   <dl class="gloss" style="margin:0">${GLOSS.map(g=>`<div class="gterm"><dt>${esc(g[0])}</dt><dd>${esc(g[1])}</dd></div>`).join('')}</dl>
   <h2 class="sec-h" style="margin:34px 0 4px">References</h2>
   <p class="note" style="margin:0 0 10px">${refs.length} papers, oldest first. Every DOI was verified against Crossref (Oct 2026).</p>
   <div class="reflist">${refs.map(r=>`<div class="refitem">
     <span class="t">${esc(r.a)} (${r.y}).</span> ${esc(r.t)}. <span class="j">${esc(r.j)}.</span>
     <a href="https://doi.org/${r.doi}" target="_blank" rel="noopener">doi:${esc(r.doi)}</a></div>`).join('')}</div>`;
};
